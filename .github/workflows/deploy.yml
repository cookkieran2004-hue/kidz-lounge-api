name: Deploy to Demo

# Every push to main goes to the Demo clinic first (code + migrations).
# Kidz Lounge gets it at 11 PM New York time: see release.yml.
on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-demo
  cancel-in-progress: false

jobs:
  demo:
    uses: ./.github/workflows/lambda-deploy.yml
    permissions:
      id-token: write
      contents: read
    with:
      role-arn: ${{ vars.DEMO_ROLE_ARN }}
      function-name: ${{ vars.DEMO_FUNCTION_NAME }}
